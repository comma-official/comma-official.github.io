*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all;
  padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}

.logo,h1,p{animation:rise .8s cubic-bezier(.34,1.45,.5,1) both}

p{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
svg .ch,svg .dot{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

body{background:#FFFFFF;color:#282828;font-family:"Wanted Sans","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.logo{width:clamp(160px,17vw,232px);height:auto;margin-bottom:clamp(40px,6vw,72px);overflow:visible}
.logo .dot{animation:pop 3.2s cubic-bezier(.45,0,.3,1) infinite;animation-delay:calc(1.1s + var(--i) * .14s)}
.logo .dot{transform-origin:50% 50%}
.logo .comma{animation-name:pop-tilt}
.logo .ch{animation:wave 3.2s ease-out infinite;animation-delay:calc(1.1s + var(--i) * .06s)}
p{color:#596068}
footer{color:#8A9096}
/* 동그라미 하나씩: 살짝 오므렸다 바깥 대각선으로 톡 */
@keyframes pop{
  0%,30%,100%{transform:none}
  6%{transform:scale(.8)}
  14%{transform:translate(calc(var(--dx) * 14%),calc(var(--dy) * 14%)) scale(1.02)}
  21%{transform:translate(calc(var(--dx) * -3%),calc(var(--dy) * -3%)) scale(.97)}
  26%{transform:none}
}
/* 쉼표는 톡 튄 다음 고개를 갸웃 */
@keyframes pop-tilt{
  0%,44%,100%{transform:none}
  6%{transform:scale(.8)}
  14%{transform:translate(calc(var(--dx) * 14%),calc(var(--dy) * 14%)) scale(1.02)}
  21%{transform:translate(calc(var(--dx) * -3%),calc(var(--dy) * -3%)) scale(.97)}
  26%{transform:none}
  32%{transform:rotate(-16deg)}
  39%{transform:rotate(7deg)}
}
/* 동그라미가 다 튄 뒤 글자 물결 */
@keyframes wave{0%,30%,52%,100%{transform:none}36%{transform:translateY(-14%)}44%{transform:none}}
